# Static GitHub Pages deploy (Linear RES-11).
# Does not run on every push — enable Pages (Settings → Pages → GitHub Actions)
# then run this workflow (Actions → Deploy GitHub Pages → Run workflow).
# Private cases, artifacts, and scripts are never uploaded.

name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run lint
      - run: npm run test:gates

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public site
        run: |
          mkdir -p _site/cases
          cp index.html _site/
          cp -r css js data _site/
          cp cases/index.json cases/example-dool-us-manual-labor.json _site/cases/
          # Never ship private fixtures, audit dumps, or tooling
          rm -rf _site/data/.git _site/cases/private
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
